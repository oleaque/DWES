        <h2>❌ Estas seguro de eliminar el Pedido || <?php echo $order->getOrderNum() ?> || ❌</h2>

    <table>
        <tr>
            <th>Detalles relacionados</th>
        </tr>
        <tr>
            <td>
                <?php foreach ($order->getDetails() as $detail): ?>

                ||
                <a href="/pedido/read/<?php echo htmlspecialchars($order->getOrderNum())?>"><?php echo htmlspecialchars($detail->getDetailNumber()) ?></a>
                ||
                <?php endif; ?>
                <?php endforeach; ?>
            </td>
        </tr>
    </table>
</form>
